name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q src app tests
      - name: Audit narasi (Kenapa·Tujuan·Dampak & Insight)
        run: |
          python src/explanations.py
          python -c "import sys; sys.path.insert(0,'src'); import insights_content; import insight; sys.exit(0 if insight.audit() else 1)"
      # Uji deteksi OFFLINE (tidak butuh API live) — deterministik.
      - name: Anomaly detection tests
        run: python tests/test_anomaly.py
      # Pipeline live (best-effort): lanjut walau API sementara gagal.
      - name: Live pipeline (best-effort)
        run: python src/run_pipeline.py || echo "live pipeline skipped (API mungkin timeout)"
